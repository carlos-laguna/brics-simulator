name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Package and code checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install project and check dependencies
        run: uv sync --locked --python 3.12 --group dev --group docs

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Check package import
        run: uv run --no-sync python -c "import brics; print(brics.__file__)"

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Build package
        run: uv build

      - name: Upload documentation site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy-docs:
    name: Publish documentation
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4