name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Package and code checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install project and check dependencies
        run: uv sync --locked --python 3.12 --group dev --group docs

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Check package import
        run: uv run --no-sync python -c "import brics; print(brics.__file__)"

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Build package
        run: uv build